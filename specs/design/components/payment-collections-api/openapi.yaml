openapi: 3.0.3
info:
  title: Payment Collections API
  version: 0.1.0
  description: Merchant collections, ledger, settlements and notifications.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            collections:read: The caller's own transactions
            ledger:read: The caller's own ledger entries
            settlements:read: The caller's own settlements
            notifications:read: The caller's own notifications
            notifications:acknowledge: Mark the caller's own notification as read
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Transaction:
      type: object
      required: [id, channel, amount, currency, status, occurredAt]
      properties:
        id: { type: string }
        channel: { type: string, enum: [mobile_money, card] }
        amount: { type: number, format: double }
        currency: { type: string, enum: [KES, NGN] }
        status: { type: string, enum: [collected, failed, reversed] }
        occurredAt: { type: string, format: date-time }
    LedgerEntry:
      type: object
      required: [id, entryType, amount, currency, createdAt]
      properties:
        id: { type: string }
        transactionId: { type: string, nullable: true }
        settlementId: { type: string, nullable: true }
        entryType: { type: string, enum: [debit, credit] }
        amount: { type: number, format: double }
        currency: { type: string, enum: [KES, NGN] }
        createdAt: { type: string, format: date-time }
    Settlement:
      type: object
      required: [id, periodStart, periodEnd, grossAmount, feeAmount, netAmount, currency, status, scheduledDate]
      properties:
        id: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        grossAmount: { type: number, format: double }
        feeAmount: { type: number, format: double }
        netAmount: { type: number, format: double }
        currency: { type: string, enum: [KES, NGN] }
        status: { type: string, enum: [scheduled, withheld, paid, failed] }
        scheduledDate: { type: string, format: date }
        paidAt: { type: string, format: date-time, nullable: true }
        payoutReference: { type: string, nullable: true }
    Notification:
      type: object
      required: [id, message, createdAt]
      properties:
        id: { type: string }
        settlementId: { type: string, nullable: true }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
security:
  - oauth2: []
paths:
  /me/transactions:
    get:
      operationId: listMyTransactions
      summary: The caller's collected transactions
      security:
        - oauth2: [collections:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: channel
          in: query
          schema: { type: string, enum: [mobile_money, card] }
        - name: status
          in: query
          schema: { type: string, enum: [collected, failed, reversed] }
      responses:
        '200':
          description: Matching transactions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/transactions/{transactionId}:
    get:
      operationId: getMyTransaction
      summary: The caller's transaction detail
      security:
        - oauth2: [collections:read]
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404':
          description: No such transaction for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/ledger-entries:
    get:
      operationId: listMyLedgerEntries
      summary: The caller's double-entry ledger
      security:
        - oauth2: [ledger:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/settlements:
    get:
      operationId: listMySettlements
      summary: The caller's settlements, past and upcoming
      security:
        - oauth2: [settlements:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, withheld, paid, failed] }
      responses:
        '200':
          description: Matching settlements
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Settlement' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/settlements/{settlementId}:
    get:
      operationId: getMySettlement
      summary: The caller's settlement detail
      security:
        - oauth2: [settlements:read]
      parameters:
        - name: settlementId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404':
          description: No such settlement for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/notifications:
    get:
      operationId: listMyNotifications
      summary: The caller's in-app notifications
      security:
        - oauth2: [notifications:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching notifications
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/notifications/{notificationId}/acknowledge:
    post:
      operationId: acknowledgeMyNotification
      summary: Mark the caller's own notification as read
      security:
        - oauth2: [notifications:acknowledge]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404':
          description: No such notification for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
